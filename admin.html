<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Prode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 para pop-ups modernos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e130c, #9a8478);
            color: #fff;
            min-height: 100vh;
        }
        .navbar-custom { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); border-bottom: 2px solid #e74c3c; }
        .admin-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; height: 100%; }
        .form-control-custom { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
        .form-control-custom:focus { background: rgba(255, 255, 255, 0.2); color: #fff; border-color: #e74c3c; box-shadow: none; }
        .form-control-custom::placeholder { color: rgba(255, 255, 255, 0.5); }
        .equipo-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 8px 0; }
        .equipo-item:last-child { border-bottom: none; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        select.form-control-custom option {
            background-color: #222;
            color: #fff;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <nav class="navbar navbar-custom shadow-sm py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center flex-wrap gap-3">
                <span class="navbar-brand mb-0 h1 fw-bold text-danger">⚙️ ADMIN PRODE</span>
                <div class="navbar-nav flex-row gap-3">
                    <a class="nav-link text-white-50 text-uppercase fw-bold px-1" style="font-size: 0.9rem;" href="predicciones.html">Volver a la App</a>
                </div>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge rounded-pill border border-danger px-3 py-2 me-2 text-danger fw-bold fs-6" style="background-color: rgba(231, 76, 60, 0.1);" id="nombreUsuario"></span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row mb-4">
            <div class="col-lg-4 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">1. Nuevo Equipo</h5>
                    <form id="formCrearEquipo" class="mb-4">
                        <div class="mb-2"><input type="text" class="form-control form-control-custom" id="nuevoEquipoNombre" placeholder="Nombre" required></div>
                        <div class="mb-3"><input type="text" class="form-control form-control-custom" id="nuevoEquipoPais" placeholder="País" required></div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill">Agregar Manual</button>
                    </form>

                    <hr class="border-secondary mb-3">
                    <h6 class="text-center text-info mb-3">Importar desde API</h6>
                    <div class="row gx-2 mb-3">
                        <div class="col-7">
                            <select id="ligaIdApi" class="form-select form-control-custom" style="font-size: 0.9rem;">
                                <option value="2">Champions League</option>
                                <option value="39">Premier League</option>
                                <option value="128">Liga Argentina</option>
                            </select>
                        </div>
                        <div class="col-5">
                            <input type="number" id="temporadaApi" class="form-control form-control-custom text-center" value="2026" placeholder="Año">
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-info w-100 fw-bold rounded-pill" onclick="importarEquiposApi()">⬇️ Descargar Equipos</button>
                </div>
            </div>
            </div>
            <div class="col-lg-4 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">2. Equipos e IDs</h5>
                    <div id="contenedorEquipos" style="max-height: 200px; overflow-y: auto;" class="text-white-50 small"></div>
                </div>
            </div>
            <div class="col-lg-4 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">3. Armar Partido</h5>
                    <form id="formCrearPartido">
                        <div class="row">
                            <div class="col-6 mb-3"><input type="number" class="form-control form-control-custom text-center" id="nuevoLocalId" placeholder="ID Local" required></div>
                            <div class="col-6 mb-3"><input type="number" class="form-control form-control-custom text-center" id="nuevoVisitanteId" placeholder="ID Visita" required></div>
                        </div>
                        <div class="mb-4"><input type="datetime-local" class="form-control form-control-custom" id="nuevaFecha" required></div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold rounded-pill">Crear Partido</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-12">
                <div class="admin-card p-4">
                    <h4 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">Partidos Pendientes</h4>
                    <div id="contenedorPartidosAdmin" class="row"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-8 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2 text-warning">Partidos Finalizados</h5>
                    <div id="contenedorPartidosFinalizados" class="row"></div>
                </div>
            </div>
            <div class="col-lg-4 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2 text-info">Gestión de Usuarios</h5>
                    <div id="contenedorUsuarios" style="max-height: 300px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('prode_token');
        if (!token) window.location.href = 'login.html';
        document.getElementById('nombreUsuario').innerText = "Admin: " + localStorage.getItem('prode_nombre');

        function cerrarSesion() {
            localStorage.removeItem('prode_token'); localStorage.removeItem('prode_nombre');
            window.location.href = 'login.html';
        }

        document.getElementById('formCrearEquipo').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nuevoEquipoNombre').value;
            const pais = document.getElementById('nuevoEquipoPais').value;
            try {
                const res = await fetch('http://localhost:5239/api/Equipos', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ nombre, pais, escudoUrl: "" })
                });
                if(res.ok) { 
                    document.getElementById('formCrearEquipo').reset(); 
                    cargarEquiposAdmin(); 
                    Swal.fire({ title: '¡Equipo agregado!', icon: 'success', toast: true, position: 'top-end', background: '#333', color: '#fff', showConfirmButton: false, timer: 3000 });
                } else Swal.fire({ title: 'Error', text: 'No se pudo crear.', icon: 'error', background: '#222', color: '#fff' });
            } catch(err) { console.error(err); }
        });

        async function cargarEquiposAdmin() {
            const res = await fetch('http://localhost:5239/api/Equipos', { headers: { 'Authorization': `Bearer ${token}` } });
            if(res.ok) {
                const equipos = await res.json();
                const cont = document.getElementById('contenedorEquipos');
                cont.innerHTML = equipos.length === 0 ? "No hay equipos cargados." : "";
                equipos.forEach(eq => {
                    const imgEscudo = eq.escudoUrl 
                        ? `<img src="${eq.escudoUrl}" alt="${eq.nombre}" style="width: 24px; height: 24px; object-fit: contain; margin-right: 8px;">` 
                        : `<span style="margin-right: 8px;">⚽</span>`;

                    cont.innerHTML += `
                        <div class="equipo-item d-flex justify-content-between align-items-center mb-2">
                            <div class="d-flex align-items-center text-truncate" style="max-width: 65%;">
                                ${imgEscudo}
                                <span class="fw-bold text-white text-uppercase text-truncate" title="${eq.nombre}">${eq.nombre}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-primary rounded-pill">ID: ${eq.id}</span>
                                <button class="btn btn-sm btn-outline-danger py-0 px-2 rounded-pill" onclick="borrarEquipo(${eq.id}, '${eq.nombre.replace(/'/g, "\\'")}')" title="Eliminar equipo">
                                    🗑️
                                </button>
                            </div>
                        </div>`;
                });
            }
        }

        async function borrarEquipo(id, nombre) {
            const confirmacion = await Swal.fire({
                title: `¿Eliminar a ${nombre}?`,
                text: "Se quitará de la lista de equipos.",
                icon: 'warning',
                showCancelButton: true,
                background: '#333',
                color: '#fff',
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!confirmacion.isConfirmed) return;

            try {
                const res = await fetch(`http://localhost:5239/api/Equipos/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    Swal.fire({ title: '¡Eliminado!', icon: 'success', toast: true, position: 'top-end', background: '#333', color: '#fff', showConfirmButton: false, timer: 2000 });
                    cargarEquiposAdmin();
                } else {
                    const err = await res.json();
                    Swal.fire({ title: 'No se pudo borrar', text: err.message, icon: 'error', background: '#222', color: '#fff' });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({ title: 'Error', text: 'Fallo al conectar con el servidor.', icon: 'error', background: '#222', color: '#fff' });
            }
        }

        document.getElementById('formCrearPartido').addEventListener('submit', async function(e) {
            e.preventDefault();
            const partido = {
                equipoLocalId: parseInt(document.getElementById('nuevoLocalId').value),
                equipoVisitanteId: parseInt(document.getElementById('nuevoVisitanteId').value),
                fecha: new Date(document.getElementById('nuevaFecha').value).toISOString(),
                estado: "Pendiente", golesLocal: 0, golesVisitante: 0
            };
            try {
                const response = await fetch('http://localhost:5239/api/Partidos', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(partido)
                });
                if (response.ok) { 
                    document.getElementById('formCrearPartido').reset(); 
                    cargarPartidosAdmin(); 
                    Swal.fire({ title: '¡Partido creado!', icon: 'success', toast: true, position: 'top-end', background: '#333', color: '#fff', showConfirmButton: false, timer: 3000 });
                } else Swal.fire({ title: 'Error', text: 'Revisá que los IDs ingresados existan en la lista.', icon: 'error', background: '#222', color: '#fff' });
            } catch(err) { console.error(err); }
        });

        let partidosGlobales = []; 
        async function cargarPartidosAdmin() {
            const response = await fetch('http://localhost:5239/api/Partidos', { headers: { 'Authorization': `Bearer ${token}` } });
            if (response.status === 401) return cerrarSesion();
            partidosGlobales = await response.json();
            
            const contPendientes = document.getElementById('contenedorPartidosAdmin');
            const contFinalizados = document.getElementById('contenedorPartidosFinalizados');
            contPendientes.innerHTML = ''; contFinalizados.innerHTML = '';

            const pendientes = partidosGlobales.filter(p => (p.estado || '').toLowerCase() !== 'finalizado');
            const finalizados = partidosGlobales.filter(p => (p.estado || '').toLowerCase() === 'finalizado');

            if (pendientes.length === 0) contPendientes.innerHTML = '<p class="text-center text-white-50 mt-3">No hay partidos pendientes.</p>';
            pendientes.forEach(p => {
                const local = p.equipoLocal ? p.equipoLocal.nombre : `Eq. ${p.equipoLocalId}`;
                const vis = p.equipoVisitante ? p.equipoVisitante.nombre : `Eq. ${p.equipoVisitanteId}`;
                const fStr = new Date(p.fecha).toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
                contPendientes.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card bg-dark border-secondary">
                            <div class="card-body p-3">
                                <div class="text-center mb-2 small text-info">${fStr}</div>
                                <h6 class="text-center text-uppercase text-white">${local} <span class="text-white-50 mx-1">vs</span> ${vis}</h6>
                                <form onsubmit="finalizarPartido(event, ${p.id})">
                                    <div class="d-flex justify-content-center gap-2 mb-3 mt-3">
                                        <input type="number" id="realLocal_${p.id}" class="form-control form-control-custom text-center text-white" style="width: 50px;" required min="0">
                                        <span class="fw-bold mt-1 text-white">-</span>
                                        <input type="number" id="realVisitante_${p.id}" class="form-control form-control-custom text-center text-white" style="width: 50px;" required min="0">
                                    </div>
                                    <button type="submit" class="btn btn-outline-warning w-100 btn-sm rounded-pill mb-2">Finalizar</button>
                                    <button type="button" class="btn btn-outline-danger w-100 btn-sm rounded-pill" onclick="borrarPartido(${p.id})">🗑 Borrar</button>
                                </form>
                            </div>
                        </div>
                    </div>`;
            });

            if (finalizados.length === 0) contFinalizados.innerHTML = '<p class="text-center text-white-50 mt-3">No hay partidos finalizados.</p>';
            finalizados.forEach(p => {
                const local = p.equipoLocal ? p.equipoLocal.nombre : `Eq. ${p.equipoLocalId}`;
                const vis = p.equipoVisitante ? p.equipoVisitante.nombre : `Eq. ${p.equipoVisitanteId}`;
                contFinalizados.innerHTML += `
                    <div class="col-md-6 mb-2">
                        <div class="card bg-dark border-secondary p-2 d-flex flex-row justify-content-between align-items-center">
                            <span class="text-white small fw-bold">${local} <span class="text-warning mx-1">${p.golesLocal} - ${p.golesVisitante}</span> ${vis}</span>
                            <button class="btn btn-sm btn-danger rounded-pill" onclick="borrarPartido(${p.id})">Borrar</button>
                        </div>
                    </div>`;
            });
        }

        async function finalizarPartido(evento, id) {
            evento.preventDefault();
            const confirmacion = await Swal.fire({ title: '¿Finalizar partido?', text: "Se repartirán los puntos.", icon: 'warning', showCancelButton: true, background: '#333', color: '#fff', confirmButtonColor: '#e74c3c' });
            if(!confirmacion.isConfirmed) return;

            const p = partidosGlobales.find(x => x.id === id);
            const body = { ...p, golesLocal: parseInt(document.getElementById(`realLocal_${id}`).value), golesVisitante: parseInt(document.getElementById(`realVisitante_${id}`).value), estado: "Finalizado" };
            const res = await fetch(`http://localhost:5239/api/Partidos/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(body) });
            
            if (res.ok) { Swal.fire({ title: '¡Finalizado!', icon: 'success', background: '#222', color: '#fff', timer: 2000, showConfirmButton: false }); cargarPartidosAdmin(); } 
            else Swal.fire({ title: 'Error al finalizar.', icon: 'error', background: '#222', color: '#fff' });
        }

        async function borrarPartido(id) {
            const confirmacion = await Swal.fire({ title: '¿Borrar partido?', text: "Se eliminará permanentemente.", icon: 'warning', showCancelButton: true, background: '#333', color: '#fff', confirmButtonColor: '#e74c3c' });
            if(!confirmacion.isConfirmed) return;

            const res = await fetch(`http://localhost:5239/api/Partidos/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) { cargarPartidosAdmin(); } else Swal.fire({ title: 'Error al borrar.', icon: 'error', background: '#222', color: '#fff' });
        }

        async function cargarUsuariosAdmin() {
            const res = await fetch('http://localhost:5239/api/Usuarios/ranking', { headers: { 'Authorization': `Bearer ${token}` } });
            if(res.ok) {
                const usuarios = await res.json();
                const cont = document.getElementById('contenedorUsuarios');
                cont.innerHTML = '';
                usuarios.forEach(u => {
                    cont.innerHTML += `
                        <div class="equipo-item d-flex justify-content-between align-items-center">
                            <span class="text-white fw-bold text-uppercase">${u.nombre} <small class="text-info">(${u.puntosTotales} pts)</small></span>
                            <button class="btn btn-sm btn-outline-danger" onclick="borrarUsuario(${u.id})">Borrar</button>
                        </div>`;
                });
            }
        }

        async function borrarUsuario(id) {
            const confirmacion = await Swal.fire({ title: '¿Eliminar usuario?', text: "Se borrarán sus apuestas.", icon: 'warning', showCancelButton: true, background: '#333', color: '#fff', confirmButtonColor: '#e74c3c' });
            if(!confirmacion.isConfirmed) return;

            const res = await fetch(`http://localhost:5239/api/Usuarios/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) { cargarUsuariosAdmin(); } else Swal.fire({ title: 'Error al borrar usuario.', icon: 'error', background: '#222', color: '#fff' });
        }

        async function borrarUsuario(id) {
            const confirmacion = await Swal.fire({ title: '¿Eliminar usuario?', text: "Se borrarán sus apuestas.", icon: 'warning', showCancelButton: true, background: '#333', color: '#fff', confirmButtonColor: '#e74c3c' });
            if(!confirmacion.isConfirmed) return;

            const res = await fetch(`http://localhost:5239/api/Usuarios/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) { cargarUsuariosAdmin(); } else Swal.fire({ title: 'Error al borrar usuario.', icon: 'error', background: '#222', color: '#fff' });
        }
        
        async function importarEquiposApi() {
            const ligaId = document.getElementById('ligaIdApi').value;
            const temporada = document.getElementById('temporadaApi').value;

            Swal.fire({
                title: 'Descargando equipos...',
                text: 'Consultando la base de datos mundial...',
                allowOutsideClick: false,
                background: 'rgba(30, 30, 30, 0.95)',
                color: '#fff',
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                const response = await fetch(`http://localhost:5239/api/Equipos/importar/${ligaId}/${temporada}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    Swal.fire({
                        title: '¡Importación exitosa!',
                        text: data.message,
                        icon: 'success',
                        background: '#222',
                        color: '#fff'
                    });
                    cargarEquiposAdmin(); 
                } else {
                    const err = await response.json();
                    Swal.fire({ title: 'Error al importar', text: err.message, icon: 'error', background: '#222', color: '#fff' });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({ title: 'Error', text: 'No se pudo conectar con tu backend.', icon: 'error', background: '#222', color: '#fff' });
            }
        }

        cargarEquiposAdmin();
        cargarPartidosAdmin();
        cargarUsuariosAdmin();
    </script>
</body>
</html>
