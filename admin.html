<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Prode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e130c, #9a8478);
            color: #fff;
            min-height: 100vh;
        }
        .navbar-custom {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e74c3c;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            animation: fadeIn 0.4s ease-out forwards;
            height: 100%;
        }
        .form-control-custom {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: #e74c3c;
            box-shadow: none;
        }
        .form-control-custom::placeholder { color: rgba(255, 255, 255, 0.5); }
        .equipo-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 8px 0; }
        .equipo-item:last-child { border-bottom: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom shadow-sm py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center flex-wrap gap-3">
                <span class="navbar-brand mb-0 h1 fw-bold text-danger">⚙️ ADMIN PRODE</span>
                <div class="navbar-nav flex-row gap-3">
                    <a class="nav-link text-white-50 text-uppercase fw-bold px-1" style="font-size: 0.9rem;" href="predicciones.html">Volver a la App</a>
                </div>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge rounded-pill border border-danger px-3 py-2 me-2 text-danger fw-bold fs-6" style="background-color: rgba(231, 76, 60, 0.1);" id="nombreUsuario"></span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-lg-4 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">1. Nuevo Equipo</h5>
                    <form id="formCrearEquipo">
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-custom" id="nuevoEquipoNombre" placeholder="Nombre (ej: Boca Juniors)" required>
                        </div>
                        <div class="mb-4">
                            <input type="text" class="form-control form-control-custom" id="nuevoEquipoPais" placeholder="País (ej: Argentina)" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill">Agregar Equipo</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-4 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">2. Equipos e IDs</h5>
                    <div id="contenedorEquipos" style="max-height: 200px; overflow-y: auto;" class="text-white-50 small">
                    </div>
                </div>
            </div>

            <div class="col-lg-4 mb-3">
                <div class="admin-card p-4">
                    <h5 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">3. Armar Partido</h5>
                    <form id="formCrearPartido">
                        <div class="row">
                            <div class="col-6 mb-3">
                                <input type="number" class="form-control form-control-custom text-center" id="nuevoLocalId" placeholder="ID Local" required>
                            </div>
                            <div class="col-6 mb-3">
                                <input type="number" class="form-control form-control-custom text-center" id="nuevoVisitanteId" placeholder="ID Visita" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <input type="datetime-local" class="form-control form-control-custom" id="nuevaFecha" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold rounded-pill">Crear Partido</button>
                    </form>
                </div>
            </div>

        </div>

        <div class="row">
            <div class="col-12">
                <div class="admin-card p-4">
                    <h4 class="mb-4 fw-bold text-center border-bottom border-secondary pb-2">Partidos Pendientes</h4>
                    <div id="contenedorPartidosAdmin" class="row">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('prode_token');
        if (!token) window.location.href = 'login.html';

        document.getElementById('nombreUsuario').innerText = "Admin: " + localStorage.getItem('prode_nombre');

        function cerrarSesion() {
            localStorage.removeItem('prode_token');
            localStorage.removeItem('prode_nombre');
            window.location.href = 'login.html';
        }

        document.getElementById('formCrearEquipo').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nuevoEquipoNombre').value;
            const pais = document.getElementById('nuevoEquipoPais').value;

            const equipo = { nombre: nombre, pais: pais, escudoUrl: "" };

            try {
                const res = await fetch('http://localhost:5239/api/Equipos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(equipo)
                });
                if(res.ok) {
                    document.getElementById('formCrearEquipo').reset();
                    cargarEquiposAdmin();
                } else {
                    alert("Error al crear equipo.");
                }
            } catch(err) { console.error(err); }
        });

        async function cargarEquiposAdmin() {
            try {
                const res = await fetch('http://localhost:5239/api/Equipos', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if(res.ok) {
                    const equipos = await res.json();
                    const contenedor = document.getElementById('contenedorEquipos');
                    contenedor.innerHTML = equipos.length === 0 ? "No hay equipos cargados." : "";
                    
                    equipos.forEach(eq => {
                        contenedor.innerHTML += `
                            <div class="equipo-item d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-white text-uppercase">${eq.nombre}</span>
                                <span class="badge bg-primary rounded-pill">ID: ${eq.id}</span>
                            </div>
                        `;
                    });
                }
            } catch(err) { console.error(err); }
        }

        document.getElementById('formCrearPartido').addEventListener('submit', async function(e) {
            e.preventDefault();
            const localId = parseInt(document.getElementById('nuevoLocalId').value);
            const visitanteId = parseInt(document.getElementById('nuevoVisitanteId').value);
            const fechaUtc = new Date(document.getElementById('nuevaFecha').value).toISOString();

            const partido = { equipoLocalId: localId, equipoVisitanteId: visitanteId, fecha: fechaUtc, estado: "Pendiente", golesLocal: 0, golesVisitante: 0 };

            try {
                const response = await fetch('http://localhost:5239/api/Partidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(partido)
                });
                if (response.ok) {
                    document.getElementById('formCrearPartido').reset();
                    cargarPartidosAdmin(); 
                } else alert("Revisá que los IDs ingresados existan.");
            } catch (error) { console.error(error); }
        });

        let partidosGlobales = []; 

        async function cargarPartidosAdmin() {
            try {
                const response = await fetch('http://localhost:5239/api/Partidos', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401) return cerrarSesion();

                const partidos = await response.json();
                partidosGlobales = partidos; 
                const contenedor = document.getElementById('contenedorPartidosAdmin');
                contenedor.innerHTML = ''; 

                const pendientes = partidos.filter(p => (p.estado || '').toLowerCase() !== 'finalizado');
                if (pendientes.length === 0) {
                    contenedor.innerHTML = '<p class="text-center text-white-50 mt-3">No hay partidos pendientes.</p>';
                    return;
                }

                pendientes.forEach(partido => {
                    const local = partido.equipoLocal ? partido.equipoLocal.nombre : `Eq. ${partido.equipoLocalId}`;
                    const visitante = partido.equipoVisitante ? partido.equipoVisitante.nombre : `Eq. ${partido.equipoVisitanteId}`;
                    const fechaStr = new Date(partido.fecha).toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});

                    contenedor.innerHTML += `
                        <div class="col-md-4 mb-3">
                            <div class="card bg-dark border-secondary">
                                <div class="card-body p-3">
                                    <div class="text-center mb-2 small text-info">${fechaStr}</div>
                                    <h6 class="text-center text-uppercase text-white">${local} <span class="text-white-50 mx-1">vs</span> ${visitante}</h6>
                                    
                                    <form onsubmit="finalizarPartido(event, ${partido.id})">
                                        <div class="d-flex justify-content-center gap-2 mb-3 mt-3">
                                            <input type="number" id="realLocal_${partido.id}" class="form-control form-control-custom text-center text-white" style="width: 50px;" placeholder="L" required min="0">
                                            <span class="fw-bold mt-1 text-white">-</span>
                                            <input type="number" id="realVisitante_${partido.id}" class="form-control form-control-custom text-center text-white" style="width: 50px;" placeholder="V" required min="0">
                                        </div>
                                        <button type="submit" class="btn btn-outline-warning w-100 btn-sm rounded-pill">Finalizar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) { console.error(error); }
        }

        async function finalizarPartido(evento, id) {
            evento.preventDefault();
            if(!confirm("¿Finalizar partido y procesar puntos?")) return;

            const golesL = parseInt(document.getElementById(`realLocal_${id}`).value);
            const golesV = parseInt(document.getElementById(`realVisitante_${id}`).value);
            const partidoViejo = partidosGlobales.find(p => p.id === id);

            const partidoActualizado = {
                id: id,
                equipoLocalId: partidoViejo.equipoLocalId,
                equipoVisitanteId: partidoViejo.equipoVisitanteId,
                fecha: partidoViejo.fecha,
                golesLocal: golesL,
                golesVisitante: golesV,
                estado: "Finalizado"
            };

            try {
                const response = await fetch(`http://localhost:5239/api/Partidos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(partidoActualizado)
                });
                if (response.ok) cargarPartidosAdmin(); 
                else alert(`Error ${response.status}: ` + await response.text());
            } catch (error) { console.error(error); }
        }

        cargarEquiposAdmin();
        cargarPartidosAdmin();
    </script>
</body>
</html>
