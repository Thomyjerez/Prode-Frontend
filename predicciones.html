<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pronósticos - Prode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
        }
        .navbar-custom {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .prode-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .prode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .team-name {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .score-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
        }
        .score-input:focus {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: none;
            border-color: #00d2ff;
        }
        .score-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-custom {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-custom:hover {
            background: linear-gradient(45deg, #3a7bd5, #00d2ff);
            opacity: 0.9;
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
       
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script src="[https://cdn.jsdelivr.net/npm/sweetalert2@11](https://cdn.jsdelivr.net/npm/sweetalert2@11)"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <nav class="navbar navbar-custom shadow-sm py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            
            <div class="d-flex align-items-center flex-wrap gap-3">
                <span class="navbar-brand mb-0 h1 fw-bold text-white">🏆 PRODE APP</span>

                <div class="navbar-nav flex-row gap-3">
                    <a class="nav-link text-white text-uppercase fw-bold px-1" style="font-size: 0.9rem;" href="predicciones.html">Partidos</a>
                    <a class="nav-link text-white-50 text-uppercase fw-bold px-1" style="font-size: 0.9rem;" href="ranking.html">Posiciones</a>
                </div>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge rounded-pill border border-info px-3 py-2 me-2 text-info fw-bold fs-6" style="background-color: rgba(0, 210, 255, 0.1);" id="nombreUsuario"></span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold text-center">Partidos Disponibles</h2>
        <div id="contenedorPartidos" class="row justify-content-center">
        </div>
    </div>

    <script>
        const token = localStorage.getItem('prode_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        document.getElementById('nombreUsuario').innerText = "Hola, " + localStorage.getItem('prode_nombre');

        function cerrarSesion() {
            localStorage.removeItem('prode_token');
            localStorage.removeItem('prode_nombre');
            window.location.href = 'login.html';
        }

        async function cargarPartidos() {
            try {
                const response = await fetch('http://localhost:5239/api/Partidos', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    alert("Tu sesión expiró.");
                    cerrarSesion();
                    return;
                }

                const partidos = await response.json();
                dibujarPartidos(partidos);
            } catch (error) {
                console.error("Error al cargar la API:", error);
            }
        }

        function dibujarPartidos(partidos) {
            const contenedor = document.getElementById('contenedorPartidos');
            contenedor.innerHTML = ''; 

            partidos.forEach(partido => {
                const local = partido.equipoLocal ? partido.equipoLocal.nombre : `Equipo ${partido.equipoLocalId}`;
                const visitante = partido.equipoVisitante ? partido.equipoVisitante.nombre : `Equipo ${partido.equipoVisitanteId}`;
                const fecha = new Date(partido.fecha).toLocaleDateString([], {day: '2-digit', month: '2-digit', year: 'numeric'});
                let estadoVisual = partido.estado;
                if (estadoVisual === 'string' || !estadoVisual) {
                    estadoVisual = 'Pendiente';
                }

                let badgeClass = "bg-primary";
                if (estadoVisual.toLowerCase() === 'finalizado') badgeClass = "bg-secondary";
                else if (estadoVisual.toLowerCase() === 'en curso') badgeClass = "bg-success";

                const tarjeta = `
                    <div class="col-lg-5 col-md-6 mb-4">
                        <div class="prode-card p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
                                <small class="text-info fw-bold">${fecha}</small>
                                <span class="badge ${badgeClass} rounded-pill px-3 py-2">${estadoVisual}</span>
                            </div>
                            
                            <h5 class="text-center mb-4 text-uppercase team-name">
                                ${local} <span class="text-info mx-2">VS</span> ${visitante}
                            </h5>
                            
                            <form onsubmit="guardarPrediccion(event, ${partido.id})">
                                <div class="row align-items-center mb-4 text-center">
                                    <div class="col-5">
                                        <input type="number" id="local_${partido.id}" class="form-control text-center score-input" placeholder="L" required min="0">
                                    </div>
                                    <div class="col-2 fw-bold text-info fs-4">-</div>
                                    <div class="col-5">
                                        <input type="number" id="visitante_${partido.id}" class="form-control text-center score-input" placeholder="V" required min="0">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-custom w-100 fw-bold py-2 text-white">Cargar Pronóstico</button>
                            </form>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjeta;
            });
        }

        async function guardarPrediccion(evento, partidoId) {
            evento.preventDefault(); 
            const golesLocal = parseInt(document.getElementById(`local_${partidoId}`).value);
            const golesVisitante = parseInt(document.getElementById(`visitante_${partidoId}`).value);

            const prediccion = {
                partidoId: partidoId,
                golesLocalPredichos: golesLocal,
                golesVisitantePredichos: golesVisitante
            };

            try {
                const response = await fetch('http://localhost:5239/api/Predicciones', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(prediccion)
                });

                if (response.ok) {
                    Swal.fire({ 
                        title: '¡Pronóstico guardado!', 
                        icon: 'success', 
                        toast: true, 
                        position: 'top-end', 
                        background: 'rgba(30, 30, 30, 0.95)', 
                        color: '#fff', 
                        showConfirmButton: false, 
                        timer: 3000 
                    });
                } else {
                    const errorText = await response.text();
                    Swal.fire({ 
                        title: 'Aviso', 
                        text: 'Ya tenés un pronóstico guardado para este partido.', 
                        icon: 'info', 
                        background: '#222', 
                        color: '#fff',
                        confirmButtonColor: '#e74c3c'
                    });
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                Swal.fire({ 
                        title: 'Error al guardar', 
                        icon: 'error', 
                        toast: true, 
                        position: 'top-end', 
                        background: 'rgba(30, 30, 30, 0.95)', 
                        color: '#fff', 
                        showConfirmButton: false, 
                        timer: 3000 
                    });
            }
        }

        cargarPartidos();
    </script>
</body>
</html>
