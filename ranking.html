<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Prode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
        }
        .navbar-custom {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .rank-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: transform 0.2s ease, background 0.2s ease;
            margin-bottom: 12px;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .rank-card:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.1);
        }
        .rank-1 { border-left: 6px solid #ffd700; } 
        .rank-2 { border-left: 6px solid #c0c0c0; } 
        .rank-3 { border-left: 6px solid #cd7f32; } 
        .rank-other { border-left: 6px solid #00d2ff; } 
        
        .points-badge {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom shadow-sm py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            
            <div class="d-flex align-items-center flex-wrap gap-3">
                <span class="navbar-brand mb-0 h1 fw-bold text-white">🏆 PRODE APP</span>

                <div class="navbar-nav flex-row gap-3">
                    <a class="nav-link text-white-50 text-uppercase fw-bold px-1" style="font-size: 0.9rem;" href="predicciones.html">Partidos</a>
                    <!-- Posiciones iluminado porque estamos acá -->
                    <a class="nav-link text-white text-uppercase fw-bold px-1" style="font-size: 0.9rem;" href="ranking.html">Posiciones</a>
                </div>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge rounded-pill border border-info px-3 py-2 me-2 text-info fw-bold fs-6" style="background-color: rgba(0, 210, 255, 0.1);" id="nombreUsuario"></span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold text-center text-uppercase" style="letter-spacing: 2px;">Tabla de Posiciones</h2>
        
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10" id="contenedorRanking">
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('prode_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        document.getElementById('nombreUsuario').innerText = "Hola, " + localStorage.getItem('prode_nombre');

        function cerrarSesion() {
            localStorage.removeItem('prode_token');
            localStorage.removeItem('prode_nombre');
            window.location.href = 'login.html';
        }

        async function cargarRanking() {
            try {
                const response = await fetch('http://localhost:5239/api/Usuarios/ranking', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    alert("Tu sesión expiró.");
                    cerrarSesion();
                    return;
                }

                const usuarios = await response.json();
                dibujarRanking(usuarios);
            } catch (error) {
                console.error("Error al cargar la API:", error);
            }
        }

        function dibujarRanking(usuarios) {
            const contenedor = document.getElementById('contenedorRanking');
            contenedor.innerHTML = ''; 

            usuarios.forEach((user, index) => {
                const posicion = index + 1;
                
                let claseBorde = 'rank-other';
                let medallaVisual = `<span class="fs-4 fw-bold text-info me-3" style="width: 30px; display: inline-block; text-align: center;">#${posicion}</span>`;

                if (posicion === 1) { 
                    claseBorde = 'rank-1'; 
                    medallaVisual = '<span class="fs-2 me-3" style="width: 30px; display: inline-block; text-align: center;">🥇</span>'; 
                } else if (posicion === 2) { 
                    claseBorde = 'rank-2'; 
                    medallaVisual = '<span class="fs-2 me-3" style="width: 30px; display: inline-block; text-align: center;">🥈</span>'; 
                } else if (posicion === 3) { 
                    claseBorde = 'rank-3'; 
                    medallaVisual = '<span class="fs-2 me-3" style="width: 30px; display: inline-block; text-align: center;">🥉</span>'; 
                }

                const fila = `
                    <div class="rank-card p-3 d-flex justify-content-between align-items-center ${claseBorde}">
                        <div class="d-flex align-items-center">
                            ${medallaVisual}
                            <span class="fs-5 fw-bold text-uppercase ms-2">${user.nombre}</span>
                        </div>
                        <div>
                            <span class="badge rounded-pill points-badge px-4 py-2">${user.puntosTotales} pts</span>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += fila;
            });
        }

        cargarRanking();

    </script>
</body>
</html>
